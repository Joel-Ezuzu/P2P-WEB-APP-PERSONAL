<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Pexora is a peer-to-peer exchange app for trading currency directly with other people." />
    <meta property="og:title" content="Pexora" />
    <meta property="og:description" content="A peer-to-peer exchange app where people trade directly with each other. A frontend portfolio demo." />
    <meta property="og:type" content="website" />
    <title>Pexora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('pexora-theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Pexora needs JavaScript to run. Please turn it on and reload the page.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
